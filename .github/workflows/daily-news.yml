name: Daily News Paper v5

on:
  schedule:
    # UTC 01:00 = Australia/Perth 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      skip_commit:
        description: '跳过 commit 数据文件（仅部署 Pages）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily-news-paper
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py

      - name: Commit generated data (best-effort)
        if: ${{ !inputs.skip_commit }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/ site/.nojekyll || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "📰 Daily update $(date +'%Y-%m-%d')"
            git push || echo "⚠️ Push failed (branch protection?) — Pages will still deploy"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
